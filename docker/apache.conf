ServerName localhost
<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <DirectoryMatch "^/var/www/html/(config|core|includes|modules|tmp|storage|tests|docker|archive)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "(^\.|\.(sqlite|sqlite3|db|zip|bak|log|sh|md|ya?ml)$|^Dockerfile$)">
        Require all denied
    </FilesMatch>
    <Directory /var/www/html/uploads>
        php_admin_flag engine off
        <FilesMatch "\.(?i:php[0-9]?|phtml|phar|html?|svg|shtml)(\.|$)">
            Require all denied
        </FilesMatch>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox"
    </Directory>
    <DirectoryMatch "^/var/www/html/uploads/(projects|project_[0-9]+)(/|$)">
        Require all denied
    </DirectoryMatch>
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
